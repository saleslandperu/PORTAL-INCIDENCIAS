name: portal-incidencias

x-node-dev: &node-dev
  build:
    context: .
    dockerfile: docker/node-dev.Dockerfile
  image: portal-incidencias-node-dev:22.20.0
  restart: unless-stopped

services:
  backend:
    <<: *node-dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    # Sin puerto publicado: solo lo consume el frontend por la red interna.

  frontend:
    <<: *node-dev
    environment:
      API_PROXY_TARGET: http://backend:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
